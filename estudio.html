<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio XP0201 · Práctica de Parcial II</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1e2433;--muted:#6b7286;--line:#e4e0d8;
  --easy:#1f4fa8;--mid:#0f7a68;--hard:#9b1d4a;--mix:#6a3fb3;--lv:var(--easy);
  --ok:#1f9d55;--bad:#d1343f;--gold:#f2b632}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:1.2rem 1rem 3rem}
.hidden{display:none!important}
header.top{background:var(--lv);color:#fff;transition:background .3s}
header.top .wrap{display:flex;align-items:center;gap:.8rem;padding-top:.9rem;padding-bottom:.9rem}
header.top b{font-size:1.05rem}
header.top .sp{flex:1}
header.top button{background:rgba(255,255,255,.18);padding:.35rem .8rem;border-radius:999px;font-weight:600;font-size:.9rem}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.15;margin:.6rem 0 .3rem}
.sub{color:var(--muted);margin-bottom:1.2rem}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem}
.lvl{background:var(--card);border-radius:18px;padding:1.1rem 1.1rem 1rem;text-align:left;border-top:8px solid var(--c);box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:.35rem;transition:transform .12s}
.lvl:hover{transform:translateY(-2px)}
.lvl .t{font-weight:800;font-size:1.2rem;color:var(--c)}
.lvl .d{color:var(--muted);font-size:.92rem}
.lvl .best{margin-top:.4rem;font-size:.85rem;font-weight:700;background:#f6f4f0;border-radius:10px;padding:.35rem .6rem}
.opts-box{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1.2rem 0;display:flex;flex-wrap:wrap;gap:.7rem 1.4rem;box-shadow:0 2px 0 var(--line)}
.opts-box label{display:flex;align-items:center;gap:.45rem;font-weight:600;font-size:.95rem}
.opts-box input{width:1.15rem;height:1.15rem;accent-color:var(--easy)}
.note{font-size:.82rem;color:var(--muted)}
/* quiz */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:.4rem 0 1rem}
.prog i{display:block;height:100%;background:var(--lv);transition:width .4s}
.meta{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.6rem}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;font-size:.82rem;font-weight:700;color:var(--muted)}
.tag.lv{background:var(--lv);color:#fff;border-color:transparent}
.tag.timer{margin-left:auto;font-size:.95rem;color:var(--ink)}
.tag.timer.low{background:var(--bad);color:#fff}
.streak{font-size:.85rem;font-weight:800;color:#d9480f}
.q{background:var(--card);border-radius:18px;padding:1.1rem 1.2rem;font-size:clamp(1.02rem,2.6vw,1.25rem);font-weight:700;line-height:1.38;box-shadow:0 2px 0 var(--line)}
.q table{border-collapse:collapse;width:100%;margin-top:.7rem;font-size:.82em;font-weight:600}
.q th,.q td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left}
.q th{background:#f6f4f0}
.tw{overflow-x:auto}
.choices{display:grid;gap:.6rem;margin:1rem 0}
.ch{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.85rem 1rem;display:flex;gap:.85rem;align-items:center;text-align:left;font-size:1rem;line-height:1.3;font-weight:600;transition:border-color .15s,background .15s}
.ch .L{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#f1eee8;color:var(--ink)}
.ch:hover{border-color:var(--lv)}
.ch.sel{border-color:var(--lv);background:color-mix(in srgb,var(--lv) 8%,#fff)}
.ch.sel .L{background:var(--lv);color:#fff}
.ch.ok{border-color:var(--ok);background:#e9f7ef}.ch.ok .L{background:var(--ok);color:#fff}
.ch.bad{border-color:var(--bad);background:#fdecee}.ch.bad .L{background:var(--bad);color:#fff}
.ch.fade{opacity:.5}
.ch:disabled{cursor:default}
.fb{border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;line-height:1.45;animation:in .3s ease}
.fb.ok{background:#e9f7ef;border-left:6px solid var(--ok)}
.fb.bad{background:#fdecee;border-left:6px solid var(--bad)}
.fb b.h{display:block;font-size:1.1rem;margin-bottom:.25rem}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.act{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
.btn{background:var(--lv);color:#fff;font-weight:800;padding:.8rem 1.4rem;border-radius:14px;font-size:1.02rem;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:disabled{background:#c9c4ba;box-shadow:none;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.kbd{font-size:.78rem;color:var(--muted);margin-right:auto;align-self:center}
@media (hover:none){.kbd{visibility:hidden}}
/* results */
.score{background:var(--card);border-radius:20px;padding:1.4rem;text-align:center;box-shadow:0 2px 0 var(--line);margin:1rem 0}
.score .big{font-size:clamp(2.6rem,10vw,4rem);font-weight:900;color:var(--lv);line-height:1}
.score .msg{font-weight:700;margin-top:.5rem;font-size:1.1rem}
.score .rec{display:inline-block;margin-top:.6rem;background:var(--gold);color:#3a2a00;font-weight:800;padding:.25rem .8rem;border-radius:999px;font-size:.9rem}
h2{font-size:1.2rem;margin:1.4rem 0 .6rem}
.bars{background:var(--card);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 2px 0 var(--line);display:grid;gap:.7rem}
.bar .lab{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;margin-bottom:.25rem}
.bar .tr{height:10px;background:#efece6;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.rev{background:var(--card);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 2px 0 var(--line);margin-bottom:.7rem;line-height:1.4}
.rev .qq{font-weight:700;margin-bottom:.45rem}
.rev .you{color:var(--bad);font-size:.92rem}
.rev .right{color:var(--ok);font-size:.92rem;font-weight:700}
.rev .ex{font-size:.9rem;color:#3c4357;margin-top:.35rem}
.empty{color:var(--muted);text-align:center;padding:1rem}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:2rem}
</style>
</head>

<main class="wrap" id="app"></main>

<script>const DATA={"facil":[{"q":"¿Qué registra la balanza de pagos de Costa Rica?","o":["Los saldos de las cuentas bancarias en moneda extranjera al cierre del año.","Las transacciones económicas entre residentes de Costa Rica y no residentes durante un período.","Los ingresos y gastos del Gobierno Central en colones y en dólares.","El valor de los bienes y servicios producidos dentro del territorio nacional durante un período."],"a":1,"calc":false,"lvl":"Recordar","e":"La balanza de pagos registra transacciones entre residentes y no residentes durante un período.","t":"Balanza de pagos y tipo de cambio"},{"q":"Una turista residente en Canadá paga por hospedarse en un hotel en Costa Rica. ¿Cómo se clasifica esa transacción en la balanza de pagos costarricense?","o":["Importación de servicios.","Exportación de bienes.","Ingreso de inversión extranjera directa.","Exportación de servicios."],"a":3,"calc":false,"lvl":"Aplicar","e":"El hotel costarricense presta un servicio a una persona no residente.","t":"Balanza de pagos y tipo de cambio"},{"q":"Durante un año, un país exporta bienes por US$800 millones e importa bienes por US$950 millones. ¿Cuál es el saldo de su balanza de bienes?","o":["Déficit de US$150 millones.","Superávit de US$150 millones.","Déficit de US$1.750 millones.","Superávit de US$1.750 millones."],"a":0,"calc":true,"lvl":"Aplicar","e":"Exportaciones menos importaciones: 800 − 950 = −150 millones de dólares (déficit).","t":"Balanza de pagos y tipo de cambio"},{"q":"Si el tipo de cambio pasa de ₡500 a ₡480 por dólar, ¿qué ocurrió con el colón frente al dólar?","o":["Se depreció, pues con cada colón se compran menos dólares.","Se depreció, pues cada dólar cuesta menos colones.","Se apreció, pues cada dólar cuesta menos colones.","Se apreció, pues con cada colón se compran menos dólares."],"a":2,"calc":false,"lvl":"Comprender","e":"Al bajar el precio del dólar, se necesitan menos colones para comprarlo.","t":"Balanza de pagos y tipo de cambio"},{"q":"Una importadora debe pagar una factura de US$2.000. Si el tipo de cambio sube de ₡500 a ₡520 por dólar, ¿cómo cambia el costo de la factura en colones?","o":["Disminuye en ₡40.000.","Aumenta en ₡40.000.","Aumenta en ₡20.000.","Permanece en ₡1.000.000."],"a":1,"calc":true,"lvl":"Aplicar","e":"La factura cuesta ₡20 más por cada dólar. El aumento total es ₡20 × 2.000 = ₡40.000.","t":"Balanza de pagos y tipo de cambio"},{"q":"Una misma canasta cuesta ₡60.000 en Costa Rica y US$120 en Estados Unidos. ¿A qué tipo de cambio la canasta cuesta lo mismo en ambos países, al expresarla en una sola moneda?","o":["₡480 por dólar.","₡600 por dólar.","₡500 por dólar.","₡720 por dólar."],"a":2,"calc":true,"lvl":"Aplicar","e":"La paridad del poder adquisitivo para la canasta se obtiene al dividir ₡60.000 entre US$120 = ₡500 por dólar.","t":"Balanza de pagos y tipo de cambio"},{"q":"Dos depósitos tienen el mismo rendimiento esperado y un riesgo similar. El depósito A se puede convertir en efectivo de inmediato, mientras que el depósito B solo puede retirarse al vencimiento. ¿Qué característica distingue al depósito A?","o":["Tiene un plazo restante más largo.","Tiene un rendimiento esperado más alto.","Tiene un riesgo de impago más bajo.","Tiene mayor liquidez."],"a":3,"calc":false,"lvl":"Comprender","e":"La liquidez mide la facilidad con que un activo puede convertirse en efectivo.","t":"Activos y paridad de intereses"},{"q":"Una persona deposita ₡200.000 a una tasa del 5 % anual durante un año. Si se omiten impuestos y comisiones, ¿cuánto recibe al vencimiento, incluido el capital inicial?","o":["₡210.000.","₡10.000.","₡200.000.","₡205.000."],"a":0,"calc":true,"lvl":"Aplicar","e":"El saldo final es ₡200.000 × 1,05 = ₡210.000.","t":"Activos y paridad de intereses"},{"q":"En el modelo de paridad de intereses estudiado en clase, se comparan dos depósitos con el mismo plazo y características similares de riesgo y liquidez. ¿Cuándo se cumple la paridad entre ellos?","o":["Cuando ambos pagan la misma tasa de interés en su propia moneda.","Cuando el tipo de cambio esperado coincide con el tipo de cambio actual.","Cuando sus rentabilidades esperadas son iguales al expresarlas en una misma moneda.","Cuando los montos iniciales depositados tienen el mismo valor al convertirlos a colones."],"a":2,"calc":false,"lvl":"Comprender","e":"La paridad compara rentabilidades esperadas expresadas en la misma moneda.","t":"Activos y paridad de intereses"},{"q":"Un depósito en dólares paga 5 % anual. Hoy el tipo de cambio es ₡500 por dólar y se espera que dentro de un año sea ₡520. Sin impuestos ni comisiones, ¿cuál es la rentabilidad esperada del depósito medida en colones?","o":["9,0 %.","9,2 %.","5,0 %.","4,0 %."],"a":1,"calc":true,"lvl":"Aplicar","e":"Por cada ₡500 iniciales se deposita US$1. Al vencimiento, US$1,05 valdrían ₡546. La ganancia esperada de ₡46 sobre ₡500 equivale al 9,2 %.","t":"Activos y paridad de intereses"},{"q":"Si la inflación es alta, ¿qué medida es coherente con una política monetaria restrictiva orientada a moderar la demanda agregada?","o":["Reducir la tasa de política monetaria para abaratar el crédito.","Comprar títulos para aumentar la liquidez del sistema financiero.","Reducir el encaje bancario para facilitar la expansión del crédito.","Aumentar la tasa de política monetaria para encarecer el crédito."],"a":3,"calc":false,"lvl":"Comprender","e":"Una tasa de política monetaria más alta tiende a encarecer el crédito y moderar el gasto.","t":"Política monetaria y cambiaria"},{"q":"Según el trilema monetario, ¿a qué objetivo debe renunciar un país si mantiene un tipo de cambio fijo y permite la libre movilidad internacional de capitales?","o":["A conducir una política monetaria independiente.","A mantener el tipo de cambio fijo.","A permitir la libre movilidad internacional de capitales.","A mantener reservas internacionales."],"a":0,"calc":false,"lvl":"Comprender","e":"Con capitales móviles, sostener el tipo de cambio fijo limita la capacidad de fijar una política monetaria propia.","t":"Política monetaria y cambiaria"},{"q":"Una importadora acuerda directamente con su banco comprar dólares dentro de 90 días a un tipo de cambio pactado hoy. Ambas partes quedan obligadas a cumplir el acuerdo. ¿Qué instrumento utiliza?","o":["Una opción de compra.","Un contrato a plazo o forward.","Un contrato de futuros.","Una permuta de tasas de interés."],"a":1,"calc":false,"lvl":"Aplicar","e":"El forward fija las condiciones de una compraventa futura y obliga a ambas partes.","t":"Derivados cambiarios"},{"q":"¿Qué característica distingue a un contrato de futuros de un contrato a plazo negociado directamente con un banco?","o":["Da a la parte compradora el derecho de decidir si ejecuta la compra.","Se diseña a la medida del monto y del vencimiento que pide cada cliente.","Se negocia en un mercado organizado con condiciones estandarizadas.","Se liquida al vencimiento sin ajustes diarios de ganancias y pérdidas."],"a":2,"calc":false,"lvl":"Recordar","e":"Los futuros se negocian en mercados organizados con condiciones estandarizadas.","t":"Derivados cambiarios"},{"q":"Una exportadora recibirá dólares dentro de tres meses. Quiere tener derecho a venderlos a un tipo de cambio pactado y conservar la posibilidad de venderlos en el mercado si el dólar sube. ¿Qué instrumento le permite hacerlo?","o":["Una opción de compra de dólares (call).","Un contrato a plazo de venta de dólares.","Un contrato de futuros de venta de dólares.","Una opción de venta de dólares (put)."],"a":3,"calc":false,"lvl":"Aplicar","e":"El put otorga el derecho (no la obligación) a vender los dólares al tipo de cambio pactado.","t":"Derivados cambiarios"},{"q":"Una empresa paga una tasa variable por su préstamo y quiere compensar esa exposición mediante una permuta o swap de tasas de interés. ¿Qué flujos debería pactar en la permuta?","o":["Pagar tasa fija y recibir la tasa variable de referencia de su préstamo.","Pagar la tasa variable de referencia de su préstamo y recibir tasa fija.","Pagar y recibir la misma tasa variable de referencia.","Pagar y recibir la misma tasa fija."],"a":0,"calc":false,"lvl":"Aplicar","e":"Lo que la empresa recibe a tasa variable en la permuta compensa el flujo variable de su préstamo.","t":"Derivados cambiarios"},{"q":"Una importadora pacta un forward con entrega de divisas para comprar US$10.000 a ₡510 por dólar. Al vencimiento, el dólar cotiza a ₡530 en el mercado. Sin comisiones, ¿cuántos colones paga por los dólares según el contrato?","o":["₡5.300.000.","₡5.200.000.","₡5.100.000.","₡200.000."],"a":2,"calc":true,"lvl":"Aplicar","e":"La empresa compra los dólares al tipo pactado: US$10.000 × ₡510 = ₡5.100.000.","t":"Derivados cambiarios"},{"q":"Un país compra maquinaria a un socio, vende alimentos a otro y depende de un tercero para obtener ciertos insumos tecnológicos. ¿Qué rasgo de la economía mundial ilustra este caso?","o":["La concentración de todos los intercambios en un único centro económico.","La existencia de varios centros económicos conectados por relaciones de interdependencia.","La división de los países en bloques comerciales que operan de forma aislada.","La autosuficiencia de los países en los sectores estratégicos."],"a":1,"calc":false,"lvl":"Comprender","e":"El país mantiene vínculos económicos con varios centros de producción y comercio.","t":"Geoeconomía y cadenas"},{"q":"Una empresa costarricense que vendía principalmente en Europa observa que crece la demanda de su producto en varias economías del Indo-Pacífico. ¿Qué megatendencia estudiada ayuda a interpretar esa oportunidad?","o":["La pérdida de importancia del consumo en las economías asiáticas emergentes.","La concentración de la demanda mundial en los mercados del Atlántico Norte.","La reducción de los vínculos comerciales entre Asia y otras regiones.","El aumento del peso de las economías del Indo-Pacífico en la demanda mundial."],"a":3,"calc":false,"lvl":"Comprender","e":"El crecimiento de la demanda en el Indo-Pacífico amplía las oportunidades comerciales en esa región.","t":"Geoeconomía y cadenas"},{"q":"Una empresa sustituye a un proveedor ubicado en otro continente por uno de un país vecino para acortar los tiempos de entrega. ¿Qué estrategia describe mejor esa decisión?","o":["Nearshoring.","Friend-shoring.","Repatriación de la producción.","Diversificación de proveedores."],"a":0,"calc":false,"lvl":"Aplicar","e":"El criterio decisivo para cambiar de proveedor es la cercanía geográfica.","t":"Geoeconomía y cadenas"},{"q":"Un país limita la venta al exterior de determinados chips avanzados para restringir el acceso de un rival a esa tecnología. ¿Qué aspecto de la geoeconomía ilustra la medida?","o":["El uso de la política fiscal para estimular el consumo interno.","La reducción de costos logísticos mediante proveedores más cercanos.","El uso de un control comercial para proteger una ventaja tecnológica estratégica.","La diversificación de destinos para ampliar las exportaciones."],"a":2,"calc":false,"lvl":"Aplicar","e":"La restricción de exportaciones busca limitar el acceso del rival a una tecnología estratégica.","t":"Geoeconomía y cadenas"},{"q":"¿Cuáles son las tres dimensiones del desarrollo sostenible según la explicación sobre la cadena del café de Dota?","o":["Productiva, logística y comercial.","Agrícola, industrial y financiera.","Local, nacional e internacional.","Económica, social y ambiental."],"a":3,"calc":false,"lvl":"Recordar","e":"La presentación considera la viabilidad económica, el bienestar social y la protección ambiental.","t":"Sostenibilidad"},{"q":"Una finca cafetalera instala un sistema de almacenamiento de agua para mantener el riego durante períodos secos más prolongados. ¿Cómo se clasifica la medida según su propósito principal?","o":["Mitigación, porque reduce las emisiones del cultivo.","Adaptación, porque ayuda a mantener la producción ante una menor disponibilidad de agua.","Compensación, porque neutraliza las emisiones del sistema de riego.","Certificación, porque acredita el cumplimiento de un estándar ambiental."],"a":1,"calc":false,"lvl":"Aplicar","e":"El almacenamiento de agua reduce la vulnerabilidad de la finca durante períodos secos.","t":"Sostenibilidad"},{"q":"Un distribuidor detecta un problema de calidad en un lote de café y necesita identificar qué envíos contienen café de ese lote. ¿Qué registro le permitiría hacerlo?","o":["Un registro que vincule el código del lote con los embarques en que se incluyó.","Un registro del volumen total de café exportado durante el mes.","Un informe sobre el costo de transporte por país de destino.","Una lista de las fincas que entregaron café durante la cosecha."],"a":0,"calc":false,"lvl":"Aplicar","e":"El vínculo entre lote y embarques permite identificar cuáles envíos contienen el café afectado (trazabilidad).","t":"Sostenibilidad"},{"q":"En una negociación multilateral, varias economías pequeñas respaldan que los requisitos comerciales se publiquen y se apliquen con criterios previsibles. ¿Qué componente del ODS 17 se refleja en esa posición?","o":["La ampliación de la capacidad de generación eléctrica renovable.","El uso eficiente del agua en los procesos productivos.","La reducción de residuos mediante el reciclaje.","La promoción de un sistema multilateral de comercio abierto y basado en normas."],"a":3,"calc":false,"lvl":"Comprender","e":"La publicación y aplicación previsible de requisitos refleja el principio de un comercio basado en normas.","t":"Sostenibilidad"}],"intermedio":[{"t":"Balanza de pagos y divisas","q":"En un año, un país registra un déficit de bienes de US$120 millones, un superávit de servicios de US$160 millones, un déficit de ingreso primario de US$55 millones y un superávit de ingreso secundario de US$25 millones. Además, recibe US$70 millones de inversión extranjera directa. ¿Cuál es el saldo de la cuenta corriente?","o":["Déficit de US$15 millones.","Superávit de US$10 millones.","Superávit de US$40 millones.","Superávit de US$80 millones."],"a":1,"calc":true,"lvl":"Aplicar","e":"El saldo es −120 + 160 − 55 + 25 = US$10 millones. La inversión extranjera directa se registra en la cuenta financiera, no en la corriente."},{"t":"Balanza de pagos y divisas","q":"Al tipo de cambio vigente, exportadores venden US$15 millones adicionales, inversionistas extranjeros convierten US$8 millones a colones e importadores compran US$30 millones adicionales. Si el mercado partía del equilibrio y las demás operaciones se mantienen, ¿qué presión generan estos movimientos?","o":["Una oferta adicional neta de US$7 millones y presión a la baja sobre el precio del dólar.","Una demanda adicional neta de US$23 millones y presión al alza sobre el precio del dólar.","Una oferta adicional neta de US$53 millones y presión a la baja sobre el precio del dólar.","Una demanda adicional neta de US$7 millones y presión al alza sobre el precio del dólar."],"a":3,"calc":true,"lvl":"Analizar","e":"La oferta adicional suma US$23 millones (15 + 8) y la demanda adicional, US$30 millones. Al tipo vigente, la diferencia de US$7 millones presiona al alza el precio del dólar."},{"t":"Balanza de pagos y divisas","q":"¿Por qué puede variar el tipo de cambio real aunque el tipo de cambio nominal permanezca constante?","o":["Porque los precios de los bienes y servicios pueden cambiar a ritmos distintos en los dos países.","Porque expresar el mismo tipo de cambio en dólares por colón modifica el poder adquisitivo relativo.","Porque el tipo de cambio real se ajusta directamente cuando cambia la tasa de interés de un país.","Porque el tipo de cambio real utiliza los precios del país extranjero como única referencia."],"a":0,"calc":false,"lvl":"Comprender","e":"El tipo de cambio real incorpora los niveles de precios de ambos países. Si estos evolucionan a ritmos distintos, cambia el precio relativo de los bienes y servicios."},{"t":"Balanza de pagos y divisas","q":"Dos depósitos tienen el mismo plazo, riesgo y liquidez. El depósito en colones ofrece una tasa de interés más alta que el depósito en dólares. ¿Qué expectativa cambiaria permitiría igualar sus rendimientos esperados al medirlos en colones?","o":["Que el dólar se deprecie frente al colón lo suficiente para compensar la diferencia de tasas.","Que el tipo de cambio se mantenga constante durante el plazo de los depósitos.","Que el dólar se aprecie frente al colón lo suficiente para compensar la diferencia de tasas.","Que el dólar se aprecie frente al colón en una magnitud que dé al depósito en dólares un rendimiento superior."],"a":2,"calc":false,"lvl":"Comprender","e":"La apreciación esperada del dólar eleva el valor en colones del depósito en dólares al vencimiento. Ese efecto puede compensar su menor tasa de interés."},{"t":"Balanza de pagos y divisas","q":"En un régimen de flotación administrada, una entrada extraordinaria de divisas presiona a la baja el precio del dólar. Si el Banco Central decide moderar ese movimiento mediante una intervención cambiaria, ¿qué operación y efecto inmediato son coherentes con ese objetivo?","o":["Vender dólares para aumentar la oferta de divisas.","Comprar dólares para aumentar la demanda de divisas.","Comprar dólares para reducir la demanda de divisas.","Vender dólares para reducir la oferta de divisas."],"a":1,"calc":false,"lvl":"Aplicar","e":"Al comprar dólares, el Banco Central agrega demanda de divisas y modera la presión a la baja sobre su precio."},{"t":"Balanza de pagos y divisas","q":"La Reserva Federal aumenta la tasa de interés en dólares, mientras que las tasas en colones y el tipo de cambio esperado permanecen constantes. Según el modelo de demanda de activos visto en clase, ¿qué ajuste inicial cabe esperar?","o":["Los depósitos en dólares pierden atractivo y el colón tiende a apreciarse.","Los depósitos en dólares ganan atractivo y el colón tiende a apreciarse.","Los depósitos en colones ganan atractivo y aumenta el precio del dólar.","Los depósitos en dólares ganan atractivo y aumenta el precio del dólar."],"a":3,"calc":false,"lvl":"Analizar","e":"La mayor tasa en dólares eleva su rendimiento esperado al tipo de cambio inicial. La mayor demanda de dólares presiona al alza su precio en colones."},{"t":"Derivados cambiarios","q":"Una exportadora pacta vender a plazo US$30.000 a ₡505 por dólar. Al vencimiento, el tipo de cambio de contado es ₡480 por dólar. Si se omiten las comisiones, ¿cuál es la diferencia entre los colones que recibe con el contrato y los que habría recibido vendiendo los dólares al contado ese día?","o":["Recibe ₡750.000 más con el contrato a plazo.","Recibe ₡750.000 menos con el contrato a plazo.","Recibe ₡25.000 más con el contrato a plazo.","Recibe el mismo monto en ambos casos."],"a":0,"calc":true,"lvl":"Aplicar","e":"El contrato permite recibir ₡25 adicionales por dólar. La diferencia es ₡25 × 30.000 = ₡750.000."},{"t":"Derivados cambiarios","q":"Una importadora compra una opción para adquirir US$10.000 a ₡500 por dólar y paga por adelantado una prima de ₡6 por dólar. Al vencimiento, el dólar vale ₡503 al contado. La importadora debe pagar la factura en esa fecha. ¿Qué decisión minimiza su costo total, incluida la prima ya pagada?","o":["Dejar vencer la opción y comprar al contado, con un costo total de ₡5.030.000.","Ejercer la opción, con un costo total de ₡5.000.000.","Ejercer la opción, con un costo total de ₡5.060.000.","Dejar vencer la opción y comprar al contado, con un costo total de ₡5.090.000."],"a":2,"calc":true,"lvl":"Analizar","e":"La prima de ₡60.000 se paga en ambos escenarios. Ejercer cuesta ₡5.060.000 en total. Comprar al contado cuesta ₡5.090.000, incluida la prima."},{"t":"Derivados cambiarios","q":"Dos empresas compran dólares mediante el mismo tipo de contrato a plazo. Una debe pagar una factura en dólares al vencimiento. La otra no tiene pagos pendientes en esa moneda y busca ganar si el dólar sube. ¿Qué distingue el propósito de ambas operaciones?","o":["Ambas son coberturas porque fijan de antemano el tipo de cambio.","Ambas son especulativas porque su resultado depende del tipo de cambio al vencimiento.","La primera es especulativa porque compra dólares para pagar una factura. La segunda es una cobertura porque fija el precio de compra.","La primera es una cobertura porque reduce un riesgo cambiario existente. La segunda es especulativa porque asume ese riesgo para buscar una ganancia."],"a":3,"calc":false,"lvl":"Comprender","e":"La primera empresa usa el contrato para dar certeza al costo en colones de una obligación que ya tiene. La segunda toma una posición para beneficiarse de un posible movimiento del tipo de cambio."},{"t":"Geoeconomía y cadenas","q":"Una empresa traslada parte de su producción a un país vecino para acortar el tiempo de entrega. Más adelante, mantiene la planta en ese país, pero sustituye un proveedor local por otro más distante al que considera confiable ante tensiones geopolíticas. ¿Qué criterio predomina en cada decisión, respectivamente?","o":["Friend-shoring en el traslado y nearshoring en el cambio de proveedor.","Nearshoring en el traslado y friend-shoring en el cambio de proveedor.","Nearshoring tanto en el traslado como en el cambio de proveedor.","Friend-shoring tanto en el traslado como en el cambio de proveedor."],"a":1,"calc":false,"lvl":"Analizar","e":"La primera decisión responde a la cercanía geográfica (nearshoring). La segunda, a la confianza geopolítica (friend-shoring)."},{"t":"Geoeconomía y cadenas","q":"Dos potencias dependen comercialmente una de otra, pero una de ellas restringe la exportación de semiconductores avanzados por razones de seguridad nacional. ¿Qué interpretación es coherente con el enfoque de lo visto en la clase de Geoeconomía?","o":["La interdependencia comercial impide aplicar restricciones en sectores estratégicos.","La restricción sectorial implica que las dos economías ya se desacoplaron por completo.","La competencia estratégica puede coexistir con la interdependencia en otros sectores.","La medida responde principalmente a una caída de la demanda de semiconductores."],"a":2,"calc":false,"lvl":"Analizar","e":"Una restricción en un sector estratégico puede coexistir con el comercio y la dependencia mutua en otros sectores."},{"t":"Geoeconomía y cadenas","q":"Una importadora compra el mismo insumo a dos proveedores de países distintos. Ambos dependen de un único fabricante para un componente indispensable. Si la empresa quiere reducir el riesgo de que fallen los dos suministros al mismo tiempo, ¿qué cambio atiende directamente ese riesgo?","o":["Buscar un proveedor que pueda obtener el componente de un fabricante alternativo.","Distribuir el volumen de compra en partes iguales entre sus dos proveedores.","Negociar un precio menor con el proveedor que vende el mayor volumen.","Aumentar la frecuencia de entrega de ambos proveedores."],"a":0,"calc":false,"lvl":"Analizar","e":"Un fabricante alternativo reduce la dependencia común que podría interrumpir ambos suministros."},{"t":"Sostenibilidad","q":"¿Por qué el volumen certificado de café de una cooperativa puede ser mayor que el volumen que logra vender con un sobreprecio?","o":["Porque el costo de la certificación determina cuántos kilogramos puede comprar cada cliente.","Porque el volumen vendido con sobreprecio determina cuánto café cumple el estándar.","Porque la certificación fija el precio del café, mientras que la cooperativa fija el volumen que comprará cada cliente.","Porque el cumplimiento del estándar y la demanda de compradores dispuestos a pagar un sobreprecio son condiciones distintas."],"a":3,"calc":false,"lvl":"Comprender","e":"La certificación acredita el cumplimiento de un estándar. El volumen que obtiene el sobreprecio depende de cuánto estén dispuestos a comprar los clientes a ese precio."},{"t":"Sostenibilidad","q":"Un centro de acopio eleva sus equipos eléctricos para evitar daños por inundación y sustituye un generador diésel por un sistema eléctrico que, según su inventario, emite menos gases de efecto invernadero. ¿Cómo se clasifican ambas medidas, respectivamente?","o":["Mitigación y adaptación.","Mitigación y mitigación.","Adaptación y mitigación.","Adaptación y adaptación."],"a":2,"calc":false,"lvl":"Aplicar","e":"Elevar los equipos reduce el daño que puede causar una inundación (adaptación). Sustituir el generador reduce las emisiones (mitigación)."},{"t":"Sostenibilidad","q":"Una cooperativa mejora el tratamiento de aguas residuales y aumenta sus ingresos por exportación. Una compradora también le solicita evidencia sobre las condiciones laborales de las personas que cosechan el café. ¿Qué documentación responde más directamente a esa solicitud y permite verificarla por lote?","o":["Resultados de los análisis de agua vinculados con las fechas de procesamiento de cada lote.","Registros de contratación, remuneración y cobertura de riesgos laborales vinculados con las fincas y períodos de cosecha de cada lote.","Facturas de exportación y comprobantes de pago a las familias productoras vinculados con cada envío.","Registros de consumo de combustible y de tiempos de traslado vinculados con cada embarque."],"a":1,"calc":false,"lvl":"Analizar","e":"Los registros laborales documentan las condiciones de quienes cosechan el café. Vincularlos con las fincas y los períodos de cosecha permite relacionar esa evidencia con cada lote."}],"dificil":[{"t":"Balanza de pagos y tipo de cambio","q":"En un año, Costa Rica registra los siguientes saldos, en millones de dólares: bienes −180, servicios +240, ingreso primario −90 e ingreso secundario +20. Además, recibe US$80 millones de inversión extranjera directa. Si al año siguiente el superávit de servicios aumenta en US$30 millones y el déficit de ingreso primario se amplía en US$15 millones, ¿cómo cambia la cuenta corriente si los demás saldos permanecen constantes?","o":["Pasa de un superávit de US$70 millones a uno de US$85 millones.","Pasa de un déficit de US$10 millones a un superávit de US$5 millones.","Pasa de un déficit de US$10 millones a un superávit de US$35 millones.","Pasa de un superávit de US$60 millones a uno de US$90 millones."],"a":1,"calc":true,"lvl":"Analizar","e":"El saldo inicial es −180 + 240 − 90 + 20 = −US$10 millones. Al año siguiente mejora en US$15 millones (+30 − 15), así que el nuevo saldo es +US$5 millones. La inversión directa pertenece a la cuenta financiera."},{"t":"Balanza de pagos y tipo de cambio","q":"Una empresa exporta cada mes US$50.000 y paga US$30.000 por insumos importados. Sus demás costos ascienden a ₡8 millones mensuales. Si el tipo de cambio baja de ₡520 a ₡490 por dólar y los precios y cantidades se mantienen, ¿qué ocurre con su resultado mensual en colones?","o":["Mejora en ₡600.000, por el ahorro en el pago de los insumos importados.","Empeora en ₡1.500.000, por la reducción del valor en colones de las exportaciones.","Mejora en ₡900.000, por la reducción del costo en colones de los insumos importados.","Empeora en ₡600.000, porque la caída de los ingresos supera el ahorro en insumos."],"a":3,"calc":true,"lvl":"Analizar","e":"La empresa recibe US$20.000 netos por mes. La caída de ₡30 por dólar reduce su resultado en ₡30 × 20.000 = ₡600.000. El menor costo de los insumos amortigua la caída del ingreso por exportaciones."},{"t":"Política cambiaria y monetaria","q":"Un país mantiene un tipo de cambio fijo y permite la libre movilidad de capitales. Su banco central reduce la tasa de interés para estimular el crédito, mientras las tasas externas permanecen constantes. Tras la reducción, aumenta la demanda de dólares al tipo de cambio oficial. ¿Qué intervención puede sostener temporalmente la paridad y qué restricción pone de manifiesto?","o":["Vender dólares de las reservas. Si la presión persiste, mantener la paridad limita la autonomía monetaria.","Comprar dólares con colones. Si la presión persiste, acumular reservas permite mantener la tasa interna elegida.","Vender dólares de las reservas. Esto permite mantener indefinidamente la paridad y la tasa interna elegida.","Comprar dólares con colones. Esto absorbe el exceso de demanda de divisas al tipo de cambio oficial."],"a":0,"calc":false,"lvl":"Analizar","e":"La venta de reservas aporta dólares al mercado y ayuda a sostener la paridad. Si la presión continúa, las reservas disminuyen y el país puede verse obligado a ajustar su política monetaria para mantener el tipo de cambio fijo (trilema)."},{"t":"Política cambiaria y monetaria","q":"Con un tipo de cambio actual de ₡500 por dólar, un depósito en colones paga 6 % anual y uno en dólares paga 4 %. Ambos tienen el mismo plazo, riesgo y liquidez. El tipo de cambio esperado dentro de un año se revisa de ₡515 a ₡505 por dólar. Si la persona inversionista elige el mayor rendimiento esperado en colones, ¿cómo cambia su decisión?","o":["Elige el depósito en colones en ambos escenarios.","Elige el depósito en dólares en ambos escenarios.","Pasa de preferir el depósito en dólares a preferir el depósito en colones.","Pasa de preferir el depósito en colones a preferir el depósito en dólares."],"a":2,"calc":true,"lvl":"Analizar","e":"Con la expectativa inicial, US$1 se convierte en US$1,04 × ₡515 = ₡535,60. Tras la revisión, en US$1,04 × ₡505 = ₡525,20. El depósito en colones produce ₡530 en ambos escenarios."},{"t":"Derivados y coberturas","q":"Una importadora debe pagar US$20.000 dentro de tres meses. Puede comprar los dólares a plazo a ₡510 por dólar o adquirir una opción de compra con precio de ejercicio de ₡505 y prima de ₡8 por dólar. Su presupuesto máximo es ₡10.300.000, incluida cualquier prima. Entre las estrategias que garantizan ese máximo, prefiere la que minimice el costo si el dólar cierra en ₡490. ¿Qué debe elegir y cuánto pagaría en ese escenario?","o":["La opción de compra, con un costo total de ₡9.960.000.","El contrato a plazo, con un costo total de ₡9.800.000.","La opción de compra, con un costo total de ₡10.260.000.","El contrato a plazo, con un costo total de ₡10.200.000."],"a":0,"calc":true,"lvl":"Analizar","e":"El contrato a plazo fija un costo de ₡10.200.000. Con la opción, el costo máximo es ₡10.260.000, incluida la prima. Ambas cumplen el presupuesto. Si el dólar cierra en ₡490, la empresa deja vencer la opción y compra al contado: 20.000 × (₡490 + ₡8) = ₡9.960.000."},{"t":"Derivados y coberturas","q":"Una exportadora recibirá US$80.000 y pagará US$50.000 a un proveedor en la misma fecha. Puede usar directamente parte del cobro para pagar al proveedor. Quiere fijar en colones el saldo de la operación y evitar la compra de dólares al contado. ¿Qué cobertura corresponde?","o":["Comprar US$30.000 a plazo, porque esa es la diferencia entre el cobro y el pago.","Vender US$80.000 a plazo, porque ese es el ingreso bruto de exportación.","Comprar US$50.000 a plazo, porque ese es el monto de la factura del proveedor.","Vender US$30.000 a plazo, porque ese es el excedente de dólares después del pago."],"a":3,"calc":true,"lvl":"Analizar","e":"El cobro cubre directamente el pago de US$50.000. La venta a plazo de los US$30.000 restantes fija su valor en colones sin generar una necesidad adicional de comprar divisas."},{"t":"Geoeconomía y cadenas","q":"Una importadora costarricense necesita contratar dos proveedores de un insumo estratégico. Cada uno puede cubrir por sí solo el pedido. La empresa busca que al menos uno opere en un país que considera un socio geopolítico confiable y que los dos utilicen puertos distintos. Entre las combinaciones que cumplen ambas condiciones, elegirá la de menor costo promedio por unidad, suponiendo compras iguales a ambos proveedores. ¿Qué combinación debe elegir?","tbl":{"h":["Proveedor","Ubicación","Socio confiable","Puerto","Costo/unidad"],"r":[["P","País vecino","No","Norte","US$9"],["Q","País distante","Sí","Norte","US$10"],["R","País vecino","No","Sur","US$11"],["S","País distante","Sí","Este","US$13"]]},"o":["P y Q.","Q y R.","P y S.","Q y S."],"a":1,"calc":true,"lvl":"Analizar","e":"Q cumple el criterio de confianza geopolítica y R usa otro puerto: costo promedio US$10,50. P y S cuestan US$11,00 y Q y S, US$11,50. P y Q quedan descartados porque comparten puerto."},{"t":"Sostenibilidad","q":"Una compradora internacional exige que las fincas proveedoras traten sus aguas residuales y demuestren que cumplen el estándar ambiental. Varias fincas pequeñas pueden adoptar el tratamiento, pero el costo de pagar una verificación cada una por separado las dejaría fuera del mercado. La compradora acepta una verificación conjunta si los resultados pueden comprobarse por finca. ¿Qué medida reduce la barrera de acceso y mantiene el estándar ambiental?","o":["Eximir a las fincas pequeñas del tratamiento y verificar únicamente a las fincas grandes.","Financiar el tratamiento de las fincas pequeñas y mantener una verificación individual a cargo de cada finca.","Organizar una verificación conjunta que distribuya los costos y documente el cumplimiento de cada finca.","Sustituir la verificación por finca por una declaración general de cumplimiento de la cooperativa."],"a":2,"calc":false,"lvl":"Analizar","e":"La verificación conjunta reduce el costo que enfrenta cada finca y conserva la evidencia individual que exige la compradora."}]};</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
function el(tag,attrs={},...kids){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")n.className=v;else if(k==="style")n.style.cssText=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c instanceof Node?c:document.createTextNode(String(c)))}return n}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LET=["A","B","C","D"];
const LEVELS={
  facil:{name:"Fácil",color:"var(--easy)",desc:"25 preguntas · conceptos y cálculos directos",t:[30,60]},
  intermedio:{name:"Intermedio",color:"var(--mid)",desc:"15 preguntas · combinar conceptos y cálculos de dos pasos",t:[45,75]},
  dificil:{name:"Difícil",color:"var(--hard)",desc:"8 casos · comparar escenarios y decisiones con varias condiciones",t:[90,150]},
  mixto:{name:"Repaso mixto",color:"var(--mix)",desc:"Preguntas al azar de los tres niveles",t:null}
};
// banco con referencia al nivel
const BANK=[];
for(const lv of ["facil","intermedio","dificil"]) DATA[lv].forEach((q,i)=>BANK.push(Object.assign({},q,{lv,n:i+1,id:lv+"-"+(i+1)})));
const CFG=Object.assign({timed:false,shuffleQ:false,shuffleO:true,mixN:15},store.get("xp0201-estudio-cfg")||{});
const saveCfg=()=>store.set("xp0201-estudio-cfg",CFG);
const BEST=store.get("xp0201-estudio-best")||{};
let R=null; // ronda actual
let tick=null;

function setLevelColor(lv){document.documentElement.style.setProperty("--lv",lv?LEVELS[lv].color:"var(--easy)")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(...k){clearInterval(tick);const A=$("#app");A.innerHTML="";A.append(...k);window.scrollTo(0,0)}
$("#home-btn").onclick=()=>home();

/* ---------- INICIO ---------- */
function home(){
  R=null; setLevelColor(null); $("#home-btn").classList.add("hidden"); $("#hdr-sub").textContent="Práctica de Parcial II";
  const card=lv=>{const L=LEVELS[lv],b=BEST[lv];
    return el("button",{class:"lvl",style:"--c:"+L.color,onclick:()=>start(lv)},
      el("span",{class:"t"},L.name),el("span",{class:"d"},lv==="mixto"?`${CFG.mixN} preguntas al azar de los tres niveles`:L.desc),
      el("span",{class:"best"},b?`🏅 Mejor resultado: ${b.pct} % (${b.ok}/${b.n})`:"Aún sin intentos"))};
  const chk=(key,txt)=>el("label",{},el("input",{type:"checkbox",checked:!!CFG[key],onchange:e=>{CFG[key]=e.target.checked;saveCfg()}}),txt);
  show(
    el("h1",{},"Estudie a su ritmo"),
    el("p",{class:"sub"},"Elija un nivel. Después de cada respuesta verá la explicación de la clave comentada y, al final, podrá repetir solo las preguntas que falló."),
    el("div",{class:"levels"},["facil","intermedio","dificil","mixto"].map(card)),
    el("div",{class:"opts-box"},
      chk("timed","⏱ Con tiempo (simular examen)"),
      chk("shuffleQ","Preguntas en orden aleatorio"),
      chk("shuffleO","Mezclar opciones A–D"),
      el("label",{},"Preguntas en repaso mixto:",el("select",{onchange:e=>{CFG.mixN=+e.target.value;saveCfg();home()}},[10,15,20,30,48].map(n=>el("option",{value:n,selected:CFG.mixN===n},n===48?"todas (48)":n))))
    ),
    el("p",{class:"note"},"Su progreso se guarda solo en este dispositivo y navegador; nadie más lo ve. Con tiempo, cada pregunta tiene el mismo tiempo que en el juego de clase.")
  );
}

/* ---------- RONDA ---------- */
function start(lv,list){
  setLevelColor(lv); $("#home-btn").classList.remove("hidden"); $("#hdr-sub").textContent=LEVELS[lv].name;
  let qs = list || (lv==="mixto" ? shuffle(BANK).slice(0,CFG.mixN) : BANK.filter(q=>q.lv===lv));
  if(!list && CFG.shuffleQ && lv!=="mixto") qs=shuffle(qs);
  qs=qs.map(q=>{const p=CFG.shuffleO?shuffle([0,1,2,3]):[0,1,2,3];return Object.assign({},q,{o:p.map(j=>q.o[j]),a:p.indexOf(q.a)})});
  R={lv,qs,i:0,res:[],streak:0,bestStreak:0,retry:!!list,done:false};
  ask();
}
function qTime(q){const t=LEVELS[q.lv].t;return q.calc?t[1]:t[0]}
function ask(){
  const q=R.qs[R.i]; let pick=null, answered=false;
  const ch=q.o.map((t,i)=>el("button",{class:"ch",onclick:()=>{if(answered)return;pick=i;ch.forEach((b,j)=>b.classList.toggle("sel",j===i));go.disabled=false}},el("span",{class:"L"},LET[i]),el("span",{},t)));
  const go=el("button",{class:"btn",disabled:true,onclick:()=>check()},"Comprobar");
  const fbBox=el("div");
  const timer=CFG.timed?el("span",{class:"tag timer"},""):null;
  const act=el("div",{class:"act"},el("span",{class:"kbd"},"Teclas: A–D o 1–4 para elegir · Enter para continuar"),go);
  show(
    el("div",{class:"meta"},el("span",{class:"tag lv"},`${R.i+1} / ${R.qs.length}`),R.lv==="mixto"?el("span",{class:"tag"},LEVELS[q.lv].name):null,q.t?el("span",{class:"tag"},q.t):null,q.calc?el("span",{class:"tag"},"🧮 Cálculo"):null,R.streak>=2?el("span",{class:"streak"},`🔥 ${R.streak} seguidas`):null,timer),
    el("div",{class:"prog"},el("i",{style:`width:${R.i/R.qs.length*100}%`})),
    el("div",{class:"q"},q.q,q.tbl?el("div",{class:"tw"},el("table",{},el("tr",{},q.tbl.h.map(x=>el("th",{},x))),q.tbl.r.map(r=>el("tr",{},r.map(x=>el("td",{},x)))))):null),
    el("div",{class:"choices"},ch), fbBox, act
  );
  if(CFG.timed){const end=Date.now()+qTime(q)*1000;
    const up=()=>{const s=Math.max(0,Math.ceil((end-Date.now())/1000));timer.textContent="⏱ "+s+" s";timer.classList.toggle("low",s<=10);if(s<=0){clearInterval(tick);check(true)}};
    up();tick=setInterval(up,250);}
  function check(timeout){
    if(answered)return; if(pick===null&&!timeout)return;
    answered=true; clearInterval(tick);
    const ok=pick===q.a;
    R.res.push({q,pick,ok,timeout:!!timeout&&pick===null});
    if(ok){R.streak++;R.bestStreak=Math.max(R.bestStreak,R.streak)} else R.streak=0;
    ch.forEach((b,j)=>{b.disabled=true;b.classList.remove("sel");if(j===q.a)b.classList.add("ok");else if(j===pick)b.classList.add("bad");else b.classList.add("fade")});
    fbBox.append(el("div",{class:"fb "+(ok?"ok":"bad")},
      el("b",{class:"h"},ok?"¡Correcto! ✅":(pick===null?"⏰ Se acabó el tiempo":"No es correcto")),
      !ok?el("div",{style:"margin-bottom:.3rem"},el("b",{},`Respuesta correcta: ${LET[q.a]}. `),q.o[q.a]):null,
      el("div",{},q.e)));
    act.innerHTML=""; const last=R.i+1>=R.qs.length;
    act.append(el("span",{class:"kbd"},"Enter para continuar"),el("button",{class:"btn",id:"next",onclick:next},last?"Ver resultados":"Siguiente →"));
    fbBox.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  function next(){R.i++; if(R.i>=R.qs.length) results(); else ask();}
  R.key=e=>{
    if(e.key==="Enter"){ if(!answered&&pick!==null){check()} else if(answered){next()} e.preventDefault(); return;}
    if(answered) return;
    const k=e.key.toUpperCase(); let idx=LET.indexOf(k); if(idx<0&&"1234".includes(k)&&k) idx=+k-1;
    if(idx>=0&&idx<4){ch[idx].click()}
  };
}
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(R&&!R.done&&R.key)R.key(e)});

/* ---------- RESULTADOS ---------- */
function results(){
  R.done=true;
  const n=R.res.length, ok=R.res.filter(r=>r.ok).length, pct=Math.round(ok/n*100);
  let rec=false;
  if(!R.retry){const b=BEST[R.lv]; if(!b||pct>b.pct){BEST[R.lv]={pct,ok,n,date:new Date().toISOString().slice(0,10)};store.set("xp0201-estudio-best",BEST);rec=true}}
  const msg=pct===100?"¡Perfecto! Domina estos contenidos. 🏆":pct>=80?"¡Muy bien! Repase los pocos detalles que fallaron.":pct>=60?"Va por buen camino. Revise las explicaciones de abajo.":"Conviene repasar estos temas y volver a intentarlo.";
  // por tema
  const by={}; for(const r of R.res){const k=(R.lv==="mixto"?LEVELS[r.q.lv].name+" · ":"")+(r.q.t||"General"); by[k]=by[k]||{ok:0,n:0}; by[k].n++; if(r.ok)by[k].ok++;}
  const wrong=R.res.filter(r=>!r.ok);
  const col=p=>p>=80?"var(--ok)":p>=60?"var(--gold)":"var(--bad)";
  show(
    el("div",{class:"score"},
      el("div",{class:"big"},pct+" %"),
      el("div",{},`${ok} de ${n} correctas${R.bestStreak>=3?` · mejor racha: ${R.bestStreak} 🔥`:""}${R.retry?" · repaso de falladas":""}`),
      el("div",{class:"msg"},msg),
      rec&&BEST[R.lv]&&Object.keys(BEST).length?el("span",{class:"rec"},"🏅 ¡Nuevo mejor resultado en este nivel!"):null),
    el("div",{class:"act",style:"justify-content:center"},
      wrong.length?el("button",{class:"btn",onclick:()=>start(R.lv,wrong.map(r=>BANK.find(b=>b.id===r.q.id)))},`🔁 Repetir solo las ${wrong.length} falladas`):null,
      el("button",{class:"btn ghost",onclick:()=>start(R.lv)},"Intentar todo de nuevo"),
      el("button",{class:"btn ghost",onclick:home},"Elegir otro nivel")),
    el("h2",{},"Resultado por tema"),
    el("div",{class:"bars"},Object.entries(by).map(([k,v])=>{const p=Math.round(v.ok/v.n*100);return el("div",{class:"bar"},el("div",{class:"lab"},el("span",{},k),el("span",{},`${v.ok}/${v.n}`)),el("div",{class:"tr"},el("i",{style:`width:${p}%;background:${col(p)}`})))})),
    el("h2",{},"Preguntas para repasar"),
    el("div",{},wrong.length?wrong.map(r=>el("div",{class:"rev"},
      el("div",{class:"qq"},(R.lv==="mixto"?`[${LEVELS[r.q.lv].name} ${r.q.n}] `:`${r.q.n}. `)+r.q.q, r.q.tbl?el("div",{class:"tw q",style:"padding:0;box-shadow:none;font-size:.9rem"},el("table",{},el("tr",{},r.q.tbl.h.map(x=>el("th",{},x))),r.q.tbl.r.map(rr=>el("tr",{},rr.map(x=>el("td",{},x)))))):null),
      el("div",{class:"you"},r.pick===null?"Sin respuesta (tiempo agotado)":"Su respuesta: "+r.q.o[r.pick]),
      el("div",{class:"right"},"Correcta: "+r.q.o[r.q.a]),
      el("div",{class:"ex"},r.q.e))):el("div",{class:"empty"},"¡No falló ninguna! 🎉")),
    el("footer",{},"XP0201 Economía Internacional · Material de práctica")
  );
}
home();
</script>
